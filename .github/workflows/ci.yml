name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install psutil pytest
      - name: Run tests
        run: pytest test_fleet_core.py test_fleet_multi.py -q

  build-windows:
    # Build the executable on every push so breakage in app.py is caught
    # even though the GUI itself is not unit-tested.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build exe
        run: |
          pip install pyinstaller psutil
          python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: TheWiseAudit-exe
          path: dist/FleetAudit.exe
